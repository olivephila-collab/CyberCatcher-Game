<!DOCTYPE html>

<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 relative">
    <div id="notif-chat" class="hidden absolute top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-slate-950 border-cyan-400 rounded-xl shadow-[0_0_20px_rgba(34,211,238,0.5)] z-50 animate-bounce">

        </div>

    <div class="p-3 bg-slate-900/95 relative text-left rounded-b-xl">

        </p>

        <div class="absolute -bottom-2.5 right-3 bg-cyan-400 text-slate-950 text-[9px] font-mono font-extrabold px-2 py-0.5 rounded-md border border-cyan-200 shadow-md uppercase tracking-wider">

        </div>

    <h1 class="text-4xl font-extrabold text-indigo-400 mb-2">CYBER CATCHER</h1>
    <p class="text-slate-300 mb-6">Interactive Cybersecurity Mini-Game</p>

    <div class="relative w-full max-w-xl rounded-2xl overflow-hidden border-4 border-indigo-500 shadow-2xl">

        <div id="start-screen" class="relative">
            <img id="gambar-start" src="bg-start-1.jpeg" alt="Start Screen CyberCatcher" class="w-full h-auto">

            <div class="absolute inset-0 flex items-center justify-center">

                <button onclick="mulaiGame()" class="absolute bottom-[24%] w-36 h-36 bg-transparent rounded-full cursor-pointer transition border-2 border-transparent"></button>
            </div>
        </div>

       
    <div id="pilih-karakter" class="hidden p-6 bg-black text-center flex flex-col items-center justify-between min-h-[420px]">
      
      <h2 class="text-2xl font-extrabold text-amber-500 font-mono tracking-wider uppercase mb-2">PILIH KARAKTER KAMU!</h2>
      
      

      <div class="relative w-full flex items-center justify-center gap-2 my-auto">
        
        <button id="btn-kiri" onclick="geserKarakter(-1)" class="text-amber-500 hover:text-amber-300 text-2xl font-bold p-2 z-10 cursor-pointer active:scale-95 transition">

          <div id="card-left" class="w-28 opacity-50 scale-90 blur-[0.5px] transition-all duration-300 flex flex-col items-center">

          <div class="w-44 bg-gradient-to-b from-rose-500 to-rose-700 border-4 border-amber-200 rounded-2xl p-3 shadow-[0_0_20px_rgba(244,63,94,0.6)] transform transition-all duration-300 flex flex-col items-center">
            <h3 id="nama-karakter-tengah" class="text-base font-extrabold text-white font-mono uppercase tracking-widest mb-1 drop-shadow">BAHTIAR</h3>
            <div class="w-44 h-48 flex items-center justify-center overflow-hidden">
              <img id="img-center" src="k3-biasa.png" class="w-full h-full scale-125 object-contain drop-shadow-lg">
            </div>
          </div>

          
          <div id="card-right" class="w-28 opacity-50 scale-90 blur-[0.5px] transition-all duration-300 flex flex-col items-center">

        </div>

        <button id="btn-kanan" onclick="geserKarakter(1)" class="text-amber-500 hover:text-amber-300 text-2xl font-bold p-2 z-10 cursor-pointer active:scale-95 transition">
          ▶

      </div>

      
      <div class="mt-2 font-mono">

        <div class="flex justify-center gap-6 text-sm font-bold">
          <button onclick="konfirmasiKarakter()" class="text-amber-300 hover:text-white flex items-center gap-1 cursor-pointer transition">
            <span class="animate-pulse">▶</span> YES
          </button>
          <button id="btn-no" onclick="batalPilih()" class="hidden text-slate-500 hover:text-slate-300 cursor-pointer">
            CANCEL
          </button>
        </div>
      </div>
    </div>
 </div> 

    <div id="basecamp" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">

          <img src="basecamp.png" class="w-full h-full object-contain">
          <div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_60px_rgba(0,0,0,0.7)] z-20"
          ></div>
          <img id="player" src="char animated/L-diamDepan.png" class="z-30 absolute w-12 h-12 transition-all duration-75" style="top: 145px; left: 341px;">
        </div>

        <div id="petunjuk" class="mt-4 text-slate-400 text-xs font-mono">
          Gunakan tombol panah atau WASD untuk menggerakkan karakter. Tekan tombol spasi untuk melakukan aksi.
        </div>
    </div>

    <div id="loading-screen" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
      <h2 class="text-2xl text-cyan-400 font-mono mb-4">Bentar yaa..</h2>
    </div>

     <div id="map-luar" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
        <div class="mb-2 text-cyan-400 font-mono text-sm tracking-widest">
        </div>
        
        <div class="relative w-[800px] h-[459px] rounded-xl overflow-hidden bg-slate-900 shadow-2xl">
          <div id="camera-luar" class="absolute top-0 left-0 w-[1600px] h-[918px] transition-transform duration-75 ease-out">
          <img id="npc-bapak" src="npc-bapak.png" class="z-25 absolute w-12 h-12 object-contain" style="top: 230px; left: 450px;">
          <img src="map-luar.png" class="w-full h-full object-contain">
          <div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_60px_rgba(0,0,0,0.7)] z-20"></div>
          <img id="player-luar" src="char animated/L-diamDepan.png" class="z-30 absolute w-12 h-12 transition-all duration-75" style="top: 300px; left: 341px;">
        </div>
      </div>
    </div>
    
    <div id="dialog-container" class="hidden fixed bottom-4 inset-x-0 mx-auto w-[90%] max-w-2xl z-[100]">

      <img id="dialog-portrait" src="" class="absolute bottom-12 left-4 h-64 md:h-80 object-contain drop-shadow-xl z-10 transition-all duration-200">

      <div id="dialog-box" class="hidden fixed bottom-6 inset-x-0 mx-auto w-[90%] max-w-2xl bg-slate-900/95 border-2 border-cyan-400 rounded-xl p-4 z-[100] shadow-[0_0_30px_rgba(34,211,238,0.4)]">
      <div class="flex itens-center gap-2 mb-1">
        <span id="dialog-speaker" class="text-cyan-400 font-mono fony-bold text-sm uppercase"></span>
      </div>
      <p id="dialog-text" class="text-white font-mono text-sm leading-relaxed white-space-pre-wrap">
        ...
      </p>
      <div class="mt-2 text-right">
        <span class="text[10px] text-cyan-300 font-mono animate-pulse">[ Tekan SPASI untuk lanjut ]</span>
      </div>
    </div>

  </div>


  <script>
    const gambar1 = "bg-start-1.jpeg";
    const gambar2 = "bg-start-2.jpeg";
    let statusGambar = 1;
    let isLocked = false;
    let stepKonfirmasi = 1;
    let sedangPindahMap = false;
    let typingInterval = null;

    const animasiStart = setInterval(function() {
      const imgElement = document.getElementById("gambar-start");
      if (imgElement) {
        if (statusGambar === 1) {
          imgElement.src = gambar2;
          statusGambar = 2;
        } else {
          imgElement.src = gambar1;
          statusGambar = 1;
        }
      }
    }, 400);

    
    const listKarakter = [
      { id: 1, key: "k1", nama: "Lily", warna: "from-indigo-700 to-indigo-900", pesan: "Hei, heii! The name's Lily! So glad we teamed up, partner! Now buckle up and win this game! Shall we?" },
      { id: 2, key: "k2", nama: "Ayu", warna: "from-indigo-700 to-indigo-900", pesan: "Hai, partner! Aku Ayu. Misi kita dimulai sekarang! Detect, Inspect, Protect! Siap?" },
      { id: 3, key: "k3", nama: "Bahtiar", warna: "from-indigo-700 to-indigo-900", pesan: "Iyeayy, I'm Bahtiar! Let's play, 'cause kita adalah partner di game ini!" }
    ];

    let indexSekarang = 0;
    let agentAktif = "k1";
    let namaAgentTerpilih = "Lily";
    let pesanAgentTerpilih = "";

    function inisialAgen(keyAgent) {
        if (keyAgent === 'k1') return 'L'; 
        if (keyAgent === 'k2') return 'A';
        if (keyAgent === 'k3') return 'B';
        return keyAgent;
      }

    function updateTampilanCarousel() {
      const total = listKarakter.length;
      const idxTengah = indexSekarang;
      const idxKiri = (indexSekarang - 1 + total) % total;
      const idxKanan = (indexSekarang + 1) % total;
      const cardCenter = document.querySelector('.w-44');
      if (cardCenter) {
        cardCenter.className = `w-44 bg-gradient-to-b ${listKarakter[idxTengah].warna} border-4 border-amber-200 rounded-2xl p-3 shadow-lg transform transition-all duration-300 flex flex-col items-center`;
     }

      document.getElementById('img-left').src = `${listKarakter[idxKiri].key}-idle.png`;
      document.getElementById('img-right').src = `${listKarakter[idxKanan].key}-idle.png`;

      const imgCenter = document.getElementById('img-center');
      if (imgCenter) {
        imgCenter.src = `${listKarakter[idxTengah].key}-biasa.png`;
        imgCenter.classList.remove('scale-110');
      }
      
      document.getElementById('nama-karakter-tengah').innerText = listKarakter[idxTengah].nama;

      agentAktif = listKarakter[idxTengah].key;
      namaAgentTerpilih = listKarakter[idxTengah].nama;
      pesanAgentTerpilih = listKarakter[idxTengah].pesan;
    }

    function geserKarakter(arah) {
      if (isLocked) return;
      const total = listKarakter.length;
      indexSekarang = (indexSekarang + arah + total) % total;
      updateTampilanCarousel();
    }

    function mulaiGame() {
      document.getElementById("gambar-start").classList.add("hidden");
      clearInterval(animasiStart);
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("pilih-karakter").classList.remove("hidden");
      document.getElementById('btn-no').classList.add('hidden');
      updateTampilanCarousel();
    }
    function konfirmasiKarakter() {
      document.getElementById('teks-tanya').innerText = "YAKIN?";
      if (stepKonfirmasi === 1) {
        stepKonfirmasi = 2;
        const btnYes = document.getElementById('btn-yes');
        if (btnYes) {
          btnYes.innerHTML = '<span class="animate-pulse">▶</span> YAKIN?';
        }
        
        document.getElementById('btn-no').classList.remove('hidden');
        
      isLocked = true;
      document.getElementById('btn-kiri').classList.add('hidden');
      document.getElementById('btn-kanan').classList.add('hidden');
      const imgCenter = document.getElementById('img-center');
      if (imgCenter) {
        imgCenter.src = `${agentAktif}-siap.png`;
        imgCenter.classList.add('scale-110', 'transition-transform');
      }


      const notifChat = document.getElementById('notif-chat');
      const notifHeader = document.getElementById('notif-header-title');
      const notifPesan = document.getElementById('notif-pesan');

      if (notifChat) {
        if (notifHeader) notifHeader.innerText = `MESSAGES`;
        if (notifPesan) notifPesan.innerText = pesanAgentTerpilih;
        notifChat.classList.remove('hidden');
      }

    } else {
      document.getElementById('pilih-karakter').classList.add('hidden');
      document.getElementById('notif-chat').classList.add('hidden');
      const menuPilih = document.getElementById('pilih-karakter');
      if (menuPilih) {
        menuPilih.classList.add('scale-125', 'blur-md', 'opacity-0', 'transition-all', 'duration-200');
      
        setTimeout(() => {
          menuPilih.classList.add('hidden');
          menuPilih.classList.remove('scale-125', 'blur-md', 'opacity-0');

          const playerImg = document.getElementById('player');
          if (playerImg) {
            const awalan = inisialAgen(agentAktif);
            playerImg.src = `char animated/${awalan}-diamDepan.png`;
          }

          const basecamp = document.getElementById('basecamp');
          if (basecamp) {
            basecamp.classList.remove('hidden');
          }
        }, 200);
      }
    }
  }

    function batalPilih() {
      stepKonfirmasi = 1;
      const teksTanya = document.getElementById('teks-tanya');
      if (teksTanya) {
        teksTanya.innerText = "PILIH DIA?";
      }

      const btnNo = document.getElementById('btn-no');
      if (btnNo) btnNo.classList.add('hidden')
    

      const btnKiri = document.getElementById('btn-kiri');
      const btnKanan = document.getElementById('btn-kanan');
      if (btnKiri) {
        btnKiri.classList.remove('hidden');
      }
      if (btnKanan) {
        btnKanan.classList.remove('hidden');
      }
      
      isLocked = false;
      const notifChat = document.getElementById('notif-chat');
      if (notifChat) notifChat.classList.add('hidden');

      const imgCenter = document.getElementById('img-center');
      if (imgCenter) {
        imgCenter.src = `${agentAktif}-biasa.png`;
        imgCenter.classList.remove('scale-110');
      }
      
    }

  let posX = 341;
  let posY = 145;
  let arahTerakhir = 'Depan';
  const kecepatan = 4;
  let petunjuk = false;

  const daftarRintangan = [
  // meja resepsionis
  // sisi kiri
  { x: 256, y: 100, w: 30, h: 95 },

  // sisi bawah
  { x: 256, y: 150, w: 140, h: 45 },

  // sisi kanan
  { x: 366, y: 100, w: 30, h: 95 },

  // pot pohon
  { x: 226, y: 30, w: 40, h: 30 },

  // sofa panjang
  { x: 136, y: 80, w: 40, h: 170 },

  // pot kesyiL
  { x: 301, y: 280, w: 30, h: 30},

  // pot kesyiR
  { x: 496, y: 225, w: 30, h: 30},

  // sofa depan papan tulis
  { x: 536, y: 35, w: 20, h: 50},
  ];

  const daftarRintanganLuar = [
  // gedung basecamp bawah
  { x: 125, y: 92, w: 236, h: 136 },

  // gedung basecamp atap
  { x: 173, y: 0, w: 152, h: 96 },

  // 2 toilet samping basecamp
  { x: 353, y: 48, w: 192, h: 132 },

  // kotak pos depan basecamp
  { x: 313, y: 276, w: 48, h: 52 },

  // jalan buntu
  { x: 589, y: 1, w: 100, h: 55 },

  // mobil container
  { x: 185, y: 504, w: 92, h: 148 },

  // kios A
  { x: 85, y: 644, w: 180, h: 136 },

  // pohons
  { x: 269, y: 700, w: 148, h: 80 },

  // kios B
  { x: 409, y: 664, w: 132, h: 112 },

  // mobil polisi
  { x: 729, y: 652, w: 88, h: 128 },

  // kolam taman
  { x: 861, y: 504, w: 280, h: 232 },

  // deret kursi lampu kulkas minuman 
  { x: 901, y: 780, w: 292, h: 44 },

  // mobil merah
  { x: 861, y: 380, w: 140, h: 76 },

  // free
  // { x: 185, y: 504, w: 92, h: 148 },

  // free
  // { x: 85, y: 644, w: 180, h: 136 },

  // free
  // { x: 269, y: 700, w: 148, h: 80 },
  ];

  function cekPintuKeluar(x, y) {
    const areaPintuKeluar = {
      minX: 311,
      maxX: 381,
      minY: 1,
      maxY: 5,
    };

    if (x >= areaPintuKeluar.minX && x <= areaPintuKeluar.maxX && y >= areaPintuKeluar.minY && y <= areaPintuKeluar.maxY && !sedangPindahMap) {
      pindahMapLuar();
    }
  }

  function updateKameraLuar() {
    const camera = document.getElementById('camera-luar');
    if (!camera) return;

    const viewW = 800;
    const viewH = 459;

    const mapW = 1600;
    const mapH = 918;

    let camX = (viewW / 2) - posX;
    let camY = (viewH / 2) - posY;

    const minCamX = viewW - mapW;
    const minCamY = viewH - mapH;
    const maxCamX = 0;
    const maxCamY = 0;

    if (camX > maxCamX) camX = maxCamX;
    if (camX < minCamX) camX = minCamX;
    if (camY > maxCamY) camY = maxCamY;
    if (camY < minCamY) camY = minCamY;

    camera.style.transform = `translate(${camX}px, ${camY}px)`;
  }

  function apakahAreaAman(nextX, nextY) {
    // lorong kanan
    if (nextX > 580 && nextY < 230) {
      if (nextX > 150 || nextY < 165) return false;
    }

    // dinding utama
    else {
      if (nextX < 136 || nextX > 556) return false;
      if (nextY < 0 || nextY > 310) return false;
    }

    // meja panjang bawah
    if (nextX > 376 && nextX < 446 && nextY > 200 && nextY < 320) {
      return false;
    }


    for (let box of daftarRintangan) {
      if (
        nextX >= box.x &&
        nextX <= box.x + box.w &&
        nextY >= box.y &&
        nextY <= box.y + box.h
      ) {
        return false;
      }
    }

    return true;
  }

  function apakahAreaLuarAman(nextX, nextY) {
    if (nextX < 0 || nextX > 1540) return false;
    if (nextY < 0 || nextY > 872) return false;

    for (let box of daftarRintanganLuar) {
      if (
        nextX >= box.x &&
        nextX <= box.x + box.w &&
        nextY >= box.y &&
        nextY <= box.y + box.h
      ) {
        return false; 
      }
    }

    return true;
  }

  let frameLari = 1;
  let waktuLangkahTerakhir = 0;
  const jedaAntaraLangkah = 200;

  window.addEventListener('keydown', function(event) {
    const basecamp = document.getElementById('basecamp');
    const mapLuar = document.getElementById('map-luar');

    const diBasecamp = basecamp && !basecamp.classList.contains('hidden');
    const diMapLuar = mapLuar && !mapLuar.classList.contains('hidden');

    if (isDialogActive) {
      if (event.key === ' ') {
        showNextDialog();
      }

      return;
    }

    if (diBasecamp || diMapLuar) {
      console.log("X:", posX, "Y:", posY);
      const playerImg = diBasecamp
        ? document.getElementById('player')
        : document.getElementById('player-luar')

      const awalan = inisialAgen(agentAktif);

      let arah = '';
      let maxFrame = 3;
      let nextX = posX;
      let nextY = posY;

      if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W') {
        nextY = posY - kecepatan;
        arah = 'Belakang';
        maxFrame = 2;
      } 
      else if (event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') {
        nextY = posY + kecepatan;
        arah = 'Depan';
        maxFrame = 3;
      } 
      else if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
        nextX = posX - kecepatan;
        arah = 'Kiri';
        maxFrame = 3;
      } 
      else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
        nextX = posX + kecepatan;
        arah = 'Kanan';
        maxFrame = 3;
      }
      
      if (arah !== '') {
        arahTerakhir = arah;

        if (!petunjuk) {
          const petunjuk = document.getElementById('petunjuk');
          if (petunjuk) {
            petunjuk.remove()
          }
        }

        if (diBasecamp) {
          if (apakahAreaAman(nextX, nextY)) {
            posX = nextX;
            posY = nextY;
 
            cekPintuKeluar(posX, posY);
          }
        } else if (diMapLuar) {
          if (apakahAreaLuarAman(nextX, nextY)) {
            posX =nextX;
            posY = nextY;
          }
        }

        const waktuSekarang = Date.now();
        if (waktuSekarang - waktuLangkahTerakhir > jedaAntaraLangkah) {
         frameLari = (frameLari % maxFrame) + 1;
        
        if (playerImg) {
          playerImg.src = `char animated/${awalan}-lari${arah}${frameLari}.png`;
        }

        waktuLangkahTerakhir = waktuSekarang;
       }
      }

      if (playerImg) {
        playerImg.style.left = posX + 'px';
        playerImg.style.top = posY + 'px';

        if (diMapLuar) {
          updateKameraLuar();
        }
      }
    }
  });

  window.addEventListener('keyup', function(event) {
    const basecamp = document.getElementById('basecamp');
    const mapLuar = document.getElementById('map-luar');

    const diBasecamp = basecamp && !basecamp.classList.contains('hidden');
    const playerImg = diBasecamp
      ? document.getElementById('player')
      : document.getElementById('player-luar')

    const awalan = inisialAgen(agentAktif);

    if (playerImg) {
      playerImg.src = `char animated/${awalan}-diam${arahTerakhir}.png`;
    }
  });

  function pindahMapLuar() {
    sedangPindahMap = true;

    const loading = document.getElementById('loading-screen');
    const basecamp = document.getElementById('basecamp');
    const mapLuar = document.getElementById('map-luar');
    
    if (loading) {
      loading.classList.remove('hidden');
    } 
    

    setTimeout(() => {
      if (basecamp) basecamp.classList.add('hidden');
      if (loading) loading.classList.add('hidden');
      if (mapLuar) {
        mapLuar.classList.remove('hidden');
      }
      
      
      posX = 245;
      posY = 240;

      const playerLuar = document.getElementById('player-luar');
      if (playerLuar) {
        const awalan = inisialAgen(agentAktif);
        playerLuar.src = `char animated/${awalan}-diamDepan.png`
        playerLuar.style.left = `${posX}px`;
        playerLuar.style.top = `${posY}px`;
      }

      updateKameraLuar();

      startDialog(dialogKeluarBasecamp);
    }, 1500);
  }

  let isDialogActive = false;
  let currentDialogIndex = 0;
  let currentDialogList = [];

  const dialogKeluarBasecamp = [
    { 
      speaker: "{PLAYER}",
      portrait: "",
      text: "Aduh.." 
    },
    { 
      speaker: "{PLAYER}",
      portrait: "",
      text: "Aduh.." 
    },
    { 
      speaker: "{PLAYER}",
      portrait: "",
      text: "Aduh.." 
    },
  ];

  function startDialog(dialogArray) {
    isDialogActive = true;
    currentDialogList = dialogArray;
    currentDialogIndex = 0;

    const dialogContainer = document.getElementById('dialog-container');
    if (dialogContainer) dialogContainer.classList.remove('hidden');

    showNextDialog();
  }

  function showNextDialog() {
    if (typingInterval) {
      clearInterval(typingInterval);
      typingInterval = null;
      const item = currentDialogList[currentDialogIndex - 1];
      document.getElementById('dialog-text').innerText = item.text;
      return;
    }

    if (currentDialogIndex < currentDialogList.length) {
      const item = currentDialogList[currentDialogIndex];

      let speakerName = item.speaker;
      if (speakerName === "{PLAYER}") {
        speakerName = namaAgentTerpilih || "PLAYER";
      }

      document.getElementById('dialog-speaker').innerText = speakerName;

      const portraitImg = document.getElemenById('dialog-portrait');
      if (portraitImg) {
        if (item.portrait) {
          portraitImg.src = item.portrait;
          portraitImg.classList.remove('hidden');
        } else {
          portraitImg.classList.add('hidden');
        }
      }
     
      const targetElement = document.getElementById('dialog-text');
      targetElement.textContent = '';

      let charIndex = 0;
      const fullText = item.text;

      typingInterval = setInterval(() => {
        if (charIndex < fullText.length) {
          targetElement.textContent = fullText.slice(0, charIndex + 1);
          charIndex++;
        } else {
          clearInterval(typingInterval);
          typingInternal = null;
        }
      }, 30);

      currentDialogIndex++;
    } else {
      isDialogActive = false;
      document.getElementById('dialog-container').classList.add('hidden');
    }
  }

  function pindahMapPerbatasan() {
    sedangPindahMap = true;

    const loading = document.getElementById('loading-screen');
    const mapLuar = document.getElementbyId('map-luar');
    const mapPerbatasan = document.getElementById('map-perbatasan');
    
    if (loading) loading.classList.remove('hidden');

    setTimeout(() => {
      if (mapLuar) mapLuar.classList.add('hidden');
      if (loading) loading.classList.add('hidden');

      if (mapPerbatasan) mapPerbatasan.classList.remove('hidden');

      posX = 50;
      posY = 400;

      const playerPerbatasan = document.getElementById('player-perbatasan');
      if (playerPerbatasan) {
        const awalan = inisialAgen(agentAktif);
        playerPerbatasan.src = `char animated/${awalan}-diamDepan.png`;
        playerPerbatasan.style.left = `${posX}px`;
        playerPerbatasan.style.top = `${posY}px`;
      }

      sedangPindahMap = false;
    }, 300);
  }
  </script>
